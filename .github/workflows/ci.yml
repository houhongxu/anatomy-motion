name: 检查 / Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix server
      - run: npm test --prefix server
      - run: python3 scripts/validate-models.py
      - run: python3 scripts/validate-learning.py
      - run: python3 scripts/test-learning.py
      - run: npm ci --prefix creator
      - run: npm test --prefix creator
